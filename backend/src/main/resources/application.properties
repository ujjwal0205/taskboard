spring.application.name=backend

# Secrets are never stored here. They come from environment variables; for local runs they are
# read from the git-ignored .env file in the project root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/taskboard}
spring.datasource.username=${DB_USERNAME:taskboard}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.mvc.problemdetails.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=24
