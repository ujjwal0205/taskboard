spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/taskboard}
spring.datasource.username=${DB_USERNAME:taskboard}
spring.datasource.password=${DB_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.mvc.problemdetails.enabled=true

app.jwt.secret=${JWT_SECRET:change-me}
app.jwt.expiration-hours=24
